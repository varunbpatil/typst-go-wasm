[package]
name = "typst-compiler"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
typst-as-lib = { version = "0.15.4", default-features = false }
typst = "0.14"
typst-pdf = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
panic = "abort"
